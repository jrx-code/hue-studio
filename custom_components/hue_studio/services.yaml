create_hub_scene:
  fields:
    name:
      required: true
      example: "Wieczór"
      selector:
        text:
    areas:
      required: true
      example: '["Salon", "hue-sypialnia:Sypialnia"]'
      selector:
        object:
    dry_run:
      default: false
      selector:
        boolean:
snapshot_scene:
  fields:
    area:
      required: true
      example: "Salon"
      selector:
        text:
    name:
      required: true
      example: "Wieczór"
      selector:
        text:
    dry_run:
      default: false
      selector:
        boolean:
copy_scene:
  fields:
    scene:
      required: true
      example: "Relaks@Salon"
      selector:
        text:
    target:
      required: true
      example: "Kuchnia"
      selector:
        text:
    name:
      selector:
        text:
    dry_run:
      default: false
      selector:
        boolean:
set_effect:
  fields:
    target:
      required: true
      example: "Salon"
      selector:
        text:
    effect:
      required: true
      example: "candle"
      selector:
        select:
          custom_value: true
          options:
            - no_effect
            - candle
            - fire
            - prism
            - sparkle
            - opal
            - glisten
            - underwater
            - cosmos
            - sunbeam
            - enchant
            - breathe
            - wave
            - random
    minutes:
      selector:
        number:
          min: 1
          max: 720
          unit_of_measurement: min
    speed:
      selector:
        number:
          min: 0
          max: 1
          step: 0.05
    dry_run:
      default: false
      selector:
        boolean:
timed_effect:
  fields:
    target:
      required: true
      example: "Sypialnia"
      selector:
        text:
    effect:
      required: true
      selector:
        select:
          options:
            - sunrise
            - sunset
            - no_effect
    minutes:
      selector:
        number:
          min: 1
          max: 60
          unit_of_measurement: min
    dry_run:
      default: false
      selector:
        boolean:
